plugins {
    id 'com.android.application'
}

android {
    namespace 'com.buti.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.buti.app.v2'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
